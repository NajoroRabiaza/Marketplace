<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription - Marketplace MG</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <a href="/" class="logo">Marketplace MG</a>
        <div class="nav-links" id="nav-links"></div>
    </nav>

    <div class="container" style="max-width:420px;">
        <h2>Creer un compte</h2>
        <div id="message" class="message" style="display:none;"></div>

        <div style="background:white; padding:24px; border:1px solid #ddd; border-radius:6px;">
            <div class="form-group">
                <label>Nom complet</label>
                <input type="text" id="nom" placeholder="Votre nom">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="votre@email.mg">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="motDePasse" placeholder="Au moins 6 caracteres">
            </div>
            <div class="form-group">
                <label>Je suis un</label>
                <select id="role">
                    <option value="client">Client (j'achete des produits)</option>
                    <option value="vendeur">Vendeur (je vends des produits)</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="inscrire()" style="width:100%;">
                S'inscrire
            </button>
            <p style="margin-top:14px; font-size:13px; text-align:center;">
                Deja un compte ? <a href="/pages/connexion.html">Se connecter</a>
            </p>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        mettreAJourNav();

        async function inscrire() {
            const nom = document.getElementById('nom').value.trim();
            const email = document.getElementById('email').value.trim();
            const motDePasse = document.getElementById('motDePasse').value;
            const role = document.getElementById('role').value;

            if (!nom || !email || !motDePasse) {
                afficherMessage('message', 'Veuillez remplir tous les champs');
                return;
            }

            try {
                const data = await appelAPI('POST', '/auth/inscription', { nom, email, motDePasse, role });
                sauvegarderSession(data.token, data.utilisateur);
                // Redirection selon le role
                window.location.href = role === 'vendeur'
                    ? '/pages/mes-produits.html'
                    : '/pages/produits.html';
            } catch (err) {
                afficherMessage('message', err.message);
            }
        }
    </script>
</body>
</html>
