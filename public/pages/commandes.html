<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mes Commandes - Marketplace MG</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <a href="/" class="logo">Marketplace MG</a>
        <div class="nav-links" id="nav-links"></div>
    </nav>

    <div class="container">
        <h2>Mes commandes</h2>
        <div id="message" class="message" style="display:none;"></div>
        <div id="liste-commandes"></div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        exigerConnexion('client');
        mettreAJourNav();

        // Traduit le statut technique en texte lisible
        const labelStatut = {
            en_attente: 'En attente',
            confirmee: 'Confirmee',
            expediee: 'Expediee',
            livree: 'Livree',
            annulee: 'Annulee'
        };

        async function chargerCommandes() {
            try {
                const commandes = await appelAPI('GET', '/commandes');
                afficherCommandes(commandes);
            } catch (err) {
                afficherMessage('message', 'Erreur : ' + err.message);
            }
        }

        function afficherCommandes(commandes) {
            const conteneur = document.getElementById('liste-commandes');

            if (commandes.length === 0) {
                conteneur.innerHTML = `
                    <p style="color:#777; margin-bottom:16px;">Vous n'avez pas encore de commandes.</p>
                    <a href="/pages/produits.html" class="btn btn-primary">Commencer mes achats</a>
                `;
                return;
            }

            conteneur.innerHTML = commandes.map(c => {
                const date = new Date(c.createdAt).toLocaleDateString('fr-FR');
                const articlesHtml = c.articles.map(a =>
                    `<li>${echapper(a.nomProduit)} x${a.quantite} - ${formaterPrix(a.prixUnitaire)}</li>`
                ).join('');

                return `
                    <div style="background:white; border:1px solid #ddd; border-radius:6px;
                                padding:16px; margin-bottom:14px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                            <div>
                                <strong>Commande du ${date}</strong><br>
                                <span style="font-size:12px; color:#777;">ID : ${echapper(c._id)}</span>
                            </div>
                            <div style="text-align:right;">
                                <span style="font-size:13px; padding:3px 8px; background:#eee;
                                             border-radius:4px;">${echapper(labelStatut[c.statut] || c.statut)}</span><br>
                                <strong style="color:#2c3e50;">${formaterPrix(c.montantTotal)}</strong>
                            </div>
                        </div>
                        <ul style="padding-left:18px; font-size:13px; color:#555;">
                            ${articlesHtml}
                        </ul>
                    </div>
                `;
            }).join('');
        }

        chargerCommandes();
    </script>
</body>
</html>
