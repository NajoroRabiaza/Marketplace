<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Marketplace MG</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <a href="/" class="logo">Marketplace MG</a>
        <div class="nav-links" id="nav-links"></div>
    </nav>

    <div class="container" style="max-width:420px;">
        <h2>Se connecter</h2>
        <div id="message" class="message" style="display:none;"></div>

        <div style="background:white; padding:24px; border:1px solid #ddd; border-radius:6px;">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="votre@email.mg">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="motDePasse" placeholder="Votre mot de passe">
            </div>
            <button class="btn btn-primary" onclick="connecter()" style="width:100%;">
                Se connecter
            </button>
            <p style="margin-top:14px; font-size:13px; text-align:center;">
                Pas encore de compte ? <a href="/pages/inscription.html">S'inscrire</a>
            </p>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        mettreAJourNav();

        async function connecter() {
            const email = document.getElementById('email').value.trim();
            const motDePasse = document.getElementById('motDePasse').value;

            if (!email || !motDePasse) {
                afficherMessage('message', 'Veuillez remplir tous les champs');
                return;
            }

            try {
                const data = await appelAPI('POST', '/auth/connexion', { email, motDePasse });
                sauvegarderSession(data.token, data.utilisateur);
                window.location.href = data.utilisateur.role === 'vendeur'
                    ? '/pages/mes-produits.html'
                    : '/pages/produits.html';
            } catch (err) {
                afficherMessage('message', err.message);
            }
        }
    </script>
</body>
</html>
